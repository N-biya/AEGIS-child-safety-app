org.gradle.jvmargs=-Xmx8G -XX:MaxMetaspaceSize=4G -XX:ReservedCodeCacheSize=512m -XX:+HeapDumpOnOutOfMemoryError
android.useAndroidX=true
# Some plugins (e.g. receive_sharing_intent) compile Java to 1.8 but Kotlin to
# the JDK default (21), which trips a strict consistency check. This mismatch is
# harmless at runtime, so downgrade the check from error to warning.
kotlin.jvm.target.validation.mode=warning
