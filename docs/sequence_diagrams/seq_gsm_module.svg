" stroke-width="1.3" stroke-dasharray="6,4" marker-end="url(#seqArrowOpen)"/><rect x="254.85000000000002" y="534.0" width="140.29999999999998" height="15" fill="#FBF6FC"/><text x="325.0" y="545.0" text-anchor="middle" font-style="italic" font-size="11.5" fill="#9579A6">send status: OK / ERROR</text>
  
