  <text x="805.0" y="42" text-anchor="middle" font-size="24" font-weight="700" fill="#6A3D8C">AEGIS — Sequence Diagram: ESP32 Wearable</text>
  <text x="805.0" y="63" text-anchor="middle" font-size="13.5" font-style="italic" fill="#9579A6">All ESP32 Wearable (edge) use cases</text>
  <rect x="105.0" y="150" width="190" height="60" rx="8" fill="#FBE3F1" stroke="#D98CC4" stroke-width="1.8"/><text x="200" y="176" text-anchor="middle" font-size="13" font-weight="700" fill="#7A3D63">ESP32 Wearable</text><text x="200" y="193" text-anchor="middle" font-size="10.5" fill="#7A3D63" opacity="0.75">(Edge Device)</text><rect x="355.0" y="150" width="190" height="60" rx="8" fill="#FCE4F0" stroke="#D89FCB" stroke-width="1.8"/><text x="450" y="176" text-anchor="middle" font-size="13" font-weight="700" fill="#7A3D63">Sensors</text><text x="450" y="193" text-anchor="middle" font-size="10.5" fill="#7A3D63" opacity="0.75">(HR / EDA / Temp / Accel)</text><rect x="605.0" y="150" width="190" height="60" rx="8" fill="#FCE4F0" stroke="#D89FCB" stroke-width="1.8"/><text x="700" y="176" text-anchor="middle" font-size="13" font-weight="700" fill="#7A3D63">ML Engine</text><text x="700" y="193" text-anchor="middle" font-size="10.5" fill="#7A3D63" opacity="0.75">(Random Forest, on-device)</text><rect x="855.0" y="150" width="190" height="60" rx="8" fill="#EFE3FB" stroke="#B98CCE" stroke-width="1.8"/><text x="950" y="176" text-anchor="middle" font-size="13" font-weight="700" fill="#5C3D78">Firebase Backend</text><text x="950" y="193" text-anchor="middle" font-size="10.5" fill="#5C3D78" opacity="0.75">(Firestore)</text><rect x="1105.0" y="150" width="190" height="60" rx="8" fill="#FBE3F1" stroke="#D98CC4" stroke-width="1.8"/><text x="1200" y="176" text-anchor="middle" font-size="13" font-weight="700" fill="#7A3D63">GSM Module</text><text x="1200" y="193" text-anchor="middle" font-size="10.5" fill="#7A3D63" opacity="0.75">(SIM800L)</text><line x1="200" y1="235" x2="200" y2="2111.0" stroke="#C9A6DE" stroke-width="1.4" stroke-dasharray="5,4"/><line x1="450" y1="235" x2="450" y2="2111.0" stroke="#C9A6DE" stroke-width="1.4" stroke-dasharray="5,4"/><line x1="700" y1="235" x2="700" y2="2111.0" stroke="#C9A6DE" stroke-width="1.4" stroke-dasharray="5,4"/><line x1="950" y1="235" x2="950" y2="2111.0" stroke="#C9A6DE" stroke-width="1.4" stroke-dasharray="5,4"/><line x1="1200" y1="235" x2="1200" y2="2111.0" stroke="#C9A6DE" stroke-width="1.4" stroke-dasharray="5,4"/><path d="M60,271 L388.0,271 L388.0,293 L376.0,301 L60,301 Z" fill="#F6ECFA" stroke="#C9A6DE" stroke-width="1.4"/><text x="72" y="290" font-size="12.5" font-weight="700" fill="#6A3D8C">Use Case 1: Perform Baseline Calibration</text><line x1="60" y1="301" x2="1550" y2="301" stroke="#D9BDEB" stroke-width="1.2" stroke-dasharray="3,4"/><text x="805.0" y="354.0" text-anchor="middle" font-size="11" font-style="italic" fill="#9579A6">[runs once over the first 7 days after onboarding]</text><line x1="200" y1="404.0" x2="450" y2="404.0" stroke="#A88FC2" stroke-width="1.5" marker-end="url(#seqArrowFilled)"/><rect x="245.7" y="384.0" width="158.6" height="15" fill="#FBF6FC"/><text x="325.0" y="395.0" text-anchor="middle" font-size="11.5" fill="#4A3B52">sample readings (periodic)</text><line x1="450" y1="454.0" x2="200" y2="454.0" stroke="#9579A6" stroke-width="1.3" stroke-dasharray="6,4" marker-end="url(#seqArrowOpen)"/><rect x="242.65" y="434.0" width="164.7" height="15" fill="#FBF6FC"/><text x="325.0" y="445.0" text-anchor="middle" font-style="italic" font-size="11.5" fill="#9579A6">raw HR / EDA / temp / accel</text><path d="M200,494.0 L258,494.0 L258,514.0 L200,514.0" fill="none" stroke="#C2569B" stroke-width="1.4" marker-end="url(#seqArrowSelf)"/><rect x="264" y="495.0" width="233.20000000000002" height="15" fill="#FBF6FC"/><text x="268" y="506.0" font-size="11.5" fill="#C2569B">compute personal mean / std baseline</text><path d="M200,544.0 L258,544.0 L258,564.0 L200,564.0" fill="none" stroke="#C2569B" stroke-width="1.4" marker-end="url(#seqArrowSelf)"/><rect x="264" y="545.0" width="189.8" height="15" fill="#FBF6FC"/><text x="268" y="556.0" font-size="11.5" fill="#C2569B">store child profile in SPIFFS</text><path d="M60,580.0 L350.0,580.0 L350.0,602.0 L338.0,610.0 L60,610.0 Z" fill="#F6ECFA" stroke="#C9A6DE" stroke-width="1.4"/><text x="72" y="599.0" font-size="12.5" font-weight="700" fill="#6A3D8C">Use Case 2: Collect Sensor Readings</text><line x1="60" y1="610.0" x2="1550" y2="610.0" stroke="#D9BDEB" stroke-width="1.2" stroke-dasharray="3,4"/><text x="805.0" y="663.0" text-anchor="middle" font-size="11" font-style="italic" fill="#9579A6">[every 10 seconds during normal monitoring]</text><line x1="200" y1="713.0" x2="450" y2="713.0" stroke="#A88FC2" stroke-width="1.5" marker-end="url(#seqArrowFilled)"/><rect x="224.35000000000002" y="693.0" width="201.29999999999998" height="15" fill="#FBF6FC"/><text x="325.0" y="704.0" text-anchor="middle" font-size="11.5" fill="#4A3B52">read HR, EDA, temp, accelerometer</text><line x1="450" y1="763.0" x2="200" y2="763.0" stroke="#9579A6" stroke-width="1.3" stroke-dasharray="6,4" marker-end="url(#seqArrowOpen)"/><rect x="285.35" y="743.0" width="79.3" height="15" fill="#FBF6FC"/><text x="325.0" y="754.0" text-anchor="middle" font-style="italic" font-size="11.5" fill="#9579A6">sensor sample</text><path d="M200,803.0 L258,803.0 L258,823.0 L200,823.0" fill="none" stroke="#C2569B" stroke-width="1.4" marker-end="url(#seqArrowSelf)"/><rect x="264" y="804.0" width="260" height="15" fill="#FBF6FC"/><text x="268" y="815.0" font-size="11.5" fill="#C2569B">apply activity filter (discard high-motion noise)</text><path d="M60,839.0 L380.4,839.0 L380.4,861.0 L368.4,869.0 L60,869.0 Z" fill="#F6ECFA" stroke="#C9A6DE" stroke-width="1.4"/><text x="72" y="858.0" font-size="12.5" font-weight="700" fill="#6A3D8C">Use Case 3: Apply Z-Score Normalization</text><line x1="60" y1="869.0" x2="1550" y2="869.0" stroke="#D9BDEB" stroke-width="1.2" stroke-dasharray="3,4"/><path d="M200,923.0 L258,923.0 L258,943.0 L200,943.0" fill="none" stroke="#C2569B" stroke-width="1.4" marker-end="url(#seqArrowSelf)"/><rect x="264" y="924.0" width="260" height="15" fill="#FBF6FC"/><text x="268" y="935.0" font-size="11.5" fill="#C2569B">normalize sample vs. stored baseline (Z-score)</text><path d="M60,959.0 L357.59999999999997,959.0 L357.59999999999997,981.0 L345.59999999999997,989.0 L60,989.0 Z" fill="#F6ECFA" stroke="#C9A6DE" stroke-width="1.4"/><text x="72" y="978.0" font-size="12.5" font-weight="700" fill="#6A3D8C">Use Case 4: Sliding Window Filtering</text><line x1="60" y1="989.0" x2="1550" y2="989.0" stroke="#D9BDEB" stroke-width="1.2" stroke-dasharray="3,4"/><path d="M200,1043.0 L258,1043.0 L258,1063.0 L200,1063.0" fill="none" stroke="#C2569B" stroke-width="1.4" marker-end="url(#seqArrowSelf)"/><rect x="264" y="1044.0" width="260" height="15" fill="#FBF6FC"/><text x="268" y="1055.0" font-size="11.5" fill="#C2569B">vote across sliding window (4-of-6 readings)</text><path d="M60,1079.0 L410.8,1079.0 L410.8,1101.0 L398.8,1109.0 L60,1109.0 Z" fill="#F6ECFA" stroke="#C9A6DE" stroke-width="1.4"/><text x="72" y="1098.0" font-size="12.5" font-weight="700" fill="#6A3D8C">Use Case 5: Classify Stress (Random Forest)</text><line x1="60" y1="1109.0" x2="1550" y2="1109.0" stroke="#D9BDEB" stroke-width="1.2" stroke-dasharray="3,4"/><line x1="200" y1="1173.0" x2="700" y2="1173.0" stroke="#A88FC2" stroke-width="1.5" marker-end="url(#seqArrowFilled)"/><rect x="355.45" y="1153.0" width="189.1" height="15" fill="#FBF6FC"/><text x="450.0" y="1164.0" text-anchor="middle" font-size="11.5" fill="#4A3B52">extractFeatures() — 14 features</text><path d="M700,1213.0 L758,1213.0 L758,1233.0 L700,1233.0" fill="none" stroke="#C2569B" stroke-width="1.4" marker-end="url(#seqArrowSelf)"/><rect x="764" y="1214.0" width="233.20000000000002" height="15" fill="#FBF6FC"/><text x="768" y="1225.0" font-size="11.5" fill="#C2569B">include: Apply Z-Score Normalization</text><path d="M700,1263.0 L758,1263.0 L758,1283.0 L700,1283.0" fill="none" stroke="#C2569B" stroke-width="1.4" marker-end="url(#seqArrowSelf)"/><rect x="764" y="1264.0" width="214.6" height="15" fill="#FBF6FC"/><text x="768" y="1275.0" font-size="11.5" fill="#C2569B">include: Sliding Window Filtering</text><path d="M700,1313.0 L758,1313.0 L758,1333.0 L700,1333.0" fill="none" stroke="#C2569B" stroke-width="1.4" marker-end="url(#seqArrowSelf)"/><rect x="764" y="1314.0" width="245.6" height="15" fill="#FBF6FC"/><text x="768" y="1325.0" font-size="11.5" fill="#C2569B">run Random Forest inference (15 trees)</text><line x1="700" y1="1373.0" x2="200" y2="1373.0" stroke="#9579A6" stroke-width="1.3" stroke-dasharray="6,4" marker-end="url(#seqArrowOpen)"/><rect x="355.45" y="1353.0" width="189.1" height="15" fill="#FBF6FC"/><text x="450.0" y="1364.0" text-anchor="middle" font-style="italic" font-size="11.5" fill="#9579A6">classification: NORMAL / STRESS</text><path d="M60,1399.0 L342.4,1399.0 L342.4,1421.0 L330.4,1429.0 L60,1429.0 Z" fill="#F6ECFA" stroke="#C9A6DE" stroke-width="1.4"/><text x="72" y="1418.0" font-size="12.5" font-weight="700" fill="#6A3D8C">Use Case 6: Detect Geofence Breach</text><line x1="60" y1="1429.0" x2="1550" y2="1429.0" stroke="#D9BDEB" stroke-width="1.2" stroke-dasharray="3,4"/><line x1="200" y1="1493.0" x2="450" y2="1493.0" stroke="#A88FC2" stroke-width="1.5" marker-end="url(#seqArrowFilled)"/><rect x="248.75" y="1473.0" width="152.5" height="15" fill="#FBF6FC"/><text x="325.0" y="1484.0" text-anchor="middle" font-size="11.5" fill="#4A3B52">read current GPS location</text><line x1="450" y1="1543.0" x2="200" y2="1543.0" stroke="#9579A6" stroke-width="1.3" stroke-dasharray="6,4" marker-end="url(#seqArrowOpen)"/><rect x="297.55" y="1523.0" width="54.9" height="15" fill="#FBF6FC"/><text x="325.0" y="1534.0" text-anchor="middle" font-style="italic" font-size="11.5" fill="#9579A6">lat / lng</text><path d="M200,1583.0 L258,1583.0 L258,1603.0 L200,1603.0" fill="none" stroke="#C2569B" stroke-width="1.4" marker-end="url(#seqArrowSelf)"/><rect x="264" y="1584.0" width="251.8" height="15" fill="#FBF6FC"/><text x="268" y="1595.0" font-size="11.5" fill="#C2569B">compare against stored safe-zone bounds</text><path d="M200,1633.0 L258,1633.0 L258,1653.0 L200,1653.0" fill="none" stroke="#C2569B" stroke-width="1.4" marker-end="url(#seqArrowSelf)"/><rect x="264" y="1634.0" width="189.8" height="15" fill="#FBF6FC"/><text x="268" y="1645.0" font-size="11.5" fill="#C2569B">flag breach if outside radius</text><path d="M60,1669.0 L334.79999999999995,1669.0 L334.79999999999995,1691.0 L322.79999999999995,1699.0 L60,1699.0 Z" fill="#F6ECFA" stroke="#C9A6DE" stroke-width="1.4"/><text x="72" y="1688.0" font-size="12.5" font-weight="700" fill="#6A3D8C">Use Case 7: Sync Data to Firebase</text><line x1="60" y1="1699.0" x2="1550" y2="1699.0" stroke="#D9BDEB" stroke-width="1.2" stroke-dasharray="3,4"/><text x="805.0" y="1752.0" text-anchor="middle" font-size="11" font-style="italic" fill="#9579A6">[if Wi-Fi available]</text><line x1="200" y1="1802.0" x2="950" y2="1802.0" stroke="#A88FC2" stroke-width="1.5" marker-end="url(#seqArrowFilled)"/><rect x="440.8" y="1782.0" width="268.4" height="15" fill="#FBF6FC"/><text x="575.0" y="1793.0" text-anchor="middle" font-size="11.5" fill="#4A3B52">uploadData(vitals, location, classification)</text><line x1="950" y1="1852.0" x2="200" y2="1852.0" stroke="#9579A6" stroke-width="1.3" stroke-dasharray="6,4" marker-end="url(#seqArrowOpen)"/><rect x="523.15" y="1832.0" width="103.69999999999999" height="15" fill="#FBF6FC"/><text x="575.0" y="1843.0" text-anchor="middle" font-style="italic" font-size="11.5" fill="#9579A6">sync acknowledged</text><text x="805.0" y="1891.0" text-anchor="middle" font-size="11" font-style="italic" fill="#9579A6">[if Wi-Fi unavailable]</text><path d="M200,1931.0 L258,1931.0 L258,1951.0 L200,1951.0" fill="none" stroke="#C2569B" stroke-width="1.4" marker-end="url(#seqArrowSelf)"/><rect x="264" y="1932.0" width="245.6" height="15" fill="#FBF6FC"/><text x="268" y="1943.0" font-size="11.5" fill="#C2569B">queue data locally, retry on reconnect</text><path d="M200,1981.0 L258,1981.0 L258,2001.0 L200,2001.0" fill="none" stroke="#C2569B" stroke-width="1.4" marker-end="url(#seqArrowSelf)"/><rect x="264" y="1982.0" width="260" height="15" fill="#FBF6FC"/><text x="268" y="1993.0" font-size="11.5" fill="#C2569B">extend: Send SMS Alert (always works offline)</text><line x1="200" y1="2041.0" x2="1200" y2="2041.0" stroke="#A88FC2" stroke-width="1.5" marker-end="url(#seqArrowFilled)"/><rect x="623.75" y="2021.0" width="152.5" height="15" fill="#FBF6FC"/><text x="700.0" y="2032.0" text-anchor="middle" font-size="11.5" fill="#4A3B52">sendSMS(alert + GPS link)</text><line x1="1200" y1="2091.0" x2="200" y2="2091.0" stroke="#9579A6" stroke-width="1.3" stroke-dasharray="6,4" marker-end="url(#seqArrowOpen)"/><rect x="657.3" y="2071.0" width="85.39999999999999" height="15" fill="#FBF6FC"/><text x="700.0" y="2082.0" text-anchor="middle" font-style="italic" font-size="11.5" fill="#9579A6">send status OK</text>
  
