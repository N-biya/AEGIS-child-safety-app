i<svg xmlns="http://www.w3.org/2000/svg" width="1300" height="1780" viewBox="0 0 1300 1780" font-family="Segoe UI, Verdana, sans-serif">

  <!-- ===== Defs ===== -->
  <defs>
    <!-- standard UML open arrowhead (dependency-style) for <<include>> -->
    <marker id="arrowInclude" markerWidth="12" markerHeight="12" refX="9" refY="5" orient="auto" markerUnits="userSpaceOnUse">
      <path d="M1,1 L9,5 L1,9" fill="none" stroke="#C2569B" stroke-width="1.4" stroke-linecap="round" stroke-linejoin="round"/>
    </marker>
    <!-- standard UML open arrowhead (dependency-style) for <<extend>> -->
    <marker id="arrowExtend" markerWidth="12" markerHeight="12" refX="9" refY="5" orient="auto" markerUnits="userSpaceOnUse">
      <path d="M1,1 L9,5 L1,9" fill="none" stroke="#7D5BA6" stroke-width="1.4" stroke-linecap="round" stroke-linejoin="round"/>
    </marker>
  </defs>

  <!-- ===== Background ===== -->
  <rect x="0" y="0" width="1300" height="1780" fill="#FBF6FC"/>

  <!-- ===== Title ===== -->
  <text x="650" y="42" text-anchor="middle" font-size="26" font-weight="700" fill="#6A3D8C">AEGIS — Use Case Diagram</text>
  <text x="650" y="66" text-anchor="middle" font-size="14" font-style="italic" fill="#9579A6">Child Safety Wearable System</text>

  <!-- ===== System boundary ===== -->
  <rect x="300" y="100" width="700" height="1530" rx="20" fill="#F6ECFA" stroke="#C9A6DE" stroke-width="2.5"/>
  <text x="320" y="132" font-size="17" font-weight="700" fill="#6A3D8C">«system» AEGIS</text>
  <line x1="320" y1="1320" x2="960" y2="1320" stroke="#D9BDEB" stroke-width="1.2" stroke-dasharray="3,4"/>
  <text x="650" y="1312" text-anchor="middle" font-size="12" font-style="italic" fill="#9579A6">Alert Dispatch Layer</text>

  <!-- ===================== ACTORS ===================== -->

  <!-- Parent / Guardian (stickman, human actor) -->
  <g stroke="#6A3D8C" stroke-width="3" fill="none" stroke-linecap="round">
    <circle cx="130" cy="195" r="17" fill="#FBE3F1" stroke="#6A3D8C"/>
    <line x1="130" y1="212" x2="130" y2="270"/>
    <line x1="100" y1="232" x2="160" y2="232"/>
    <line x1="130" y1="270" x2="105" y2="312"/>
    <line x1="130" y1="270" x2="155" y2="312"/>
  </g>
  <text x="130" y="335" text-anchor="middle" font-size="15" font-weight="700" fill="#6A3D8C">Parent / Guardian</text>
  <text x="130" y="353" text-anchor="middle" font-size="11" fill="#9579A6">(Human Actor)</text>

  <!-- ESP32 Wearable (system actor) -->
  <rect x="1090" y="225" width="160" height="70" rx="8" fill="#FBE3F1" stroke="#D98CC4" stroke-width="2"/>
  <text x="1170" y="253" text-anchor="middle" font-size="14" font-weight="700" fill="#7A3D63">ESP32 Wearable</text>
  <text x="1170" y="270" text-anchor="middle" font-size="11" fill="#9C6B89">(Edge Device)</text>
  <text x="1170" y="285" text-anchor="middle" font-size="10" fill="#B388B0">«system actor»</text>

  <!-- Firebase Backend (system actor) -->
  <rect x="50" y="1465" width="160" height="70" rx="8" fill="#EFE3FB" stroke="#B98CCE" stroke-width="2"/>
  <text x="130" y="1493" text-anchor="middle" font-size="14" font-weight="700" fill="#5C3D78">Firebase Backend</text>
  <text x="130" y="1510" text-anchor="middle" font-size="11" fill="#8A6FA0">(Cloud Sync)</text>
  <text x="130" y="1525" text-anchor="middle" font-size="10" fill="#B19BC4">«system actor»</text>

  <!-- GSM Module (system actor) -->
  <rect x="1090" y="1465" width="160" height="70" rx="8" fill="#FBE3F1" stroke="#D98CC4" stroke-width="2"/>
  <text x="1170" y="1493" text-anchor="middle" font-size="14" font-weight="700" fill="#7A3D63">GSM Module</text>
  <text x="1170" y="1510" text-anchor="middle" font-size="11" fill="#9C6B89">(SIM800L)</text>
  <text x="1170" y="1525" text-anchor="middle" font-size="10" fill="#B388B0">«system actor»</text>

  <!-- ===================== ASSOCIATIONS (solid, orthogonal, no arrowhead) ===================== -->
  <g stroke="#A88FC2" stroke-width="1.5" fill="none" stroke-linecap="square">
    <!-- Parent -> left column use cases (single trunk at x=230, branches to each use case) -->
    <path d="M160,232 L230,232 L230,180 L335,180"/>
    <path d="M160,232 L230,232 L230,290 L335,290"/>
    <path d="M160,232 L230,232 L230,400 L335,400"/>
    <path d="M160,232 L230,232 L230,510 L335,510"/>
    <path d="M160,232 L230,232 L230,620 L335,620"/>
    <path d="M160,232 L230,232 L230,730 L335,730"/>
    <path d="M160,232 L230,232 L230,840 L335,840"/>
    <path d="M160,232 L230,232 L230,950 L335,950"/>
    <path d="M160,232 L230,232 L230,1060 L335,1060"/>
    <path d="M160,232 L230,232 L230,1190 L335,1190"/>
    <!-- ESP32 -> right column use cases (single trunk at x=960, branches to each use case) -->
    <path d="M1090,260 L960,260 L960,180 L905,180"/>
    <path d="M1090,260 L960,260 L960,290 L905,290"/>
    <path d="M1090,260 L960,260 L960,400 L905,400"/>
    <path d="M1090,260 L960,260 L960,510 L905,510"/>
    <path d="M1090,260 L960,260 L960,620 L905,620"/>
    <path d="M1090,260 L960,260 L960,730 L905,730"/>
    <path d="M1090,260 L960,260 L960,840 L905,840"/>
    <!-- Firebase -> Push FCM Notification -->
    <path d="M130,1465 L130,1430 L620,1430 L620,1413"/>
    <!-- Firebase -> Sync Data to Firebase (routed via the column gap, clear of the left-column use cases) -->
    <path d="M130,1465 L130,895 L685,895 L685,840 L695,840"/>
    <!-- GSM -> Send SMS Alert -->
    <path d="M1170,1465 L1170,1430 L985,1430 L985,1392"/>
  </g>

  <!-- ===================== LEFT COLUMN USE CASES (Parent) ===================== -->
  <g>
    <ellipse cx="440" cy="180" rx="105" ry="33" fill="#F3E5F5" stroke="#B57EDC" stroke-width="1.8"/>
    <text x="440" y="184" text-anchor="middle" font-size="13.5" fill="#4A3B52">Register / Login</text>

    <ellipse cx="440" cy="290" rx="105" ry="33" fill="#F3E5F5" stroke="#B57EDC" stroke-width="1.8"/>
    <text x="440" y="294" text-anchor="middle" font-size="13.5" fill="#4A3B52">Onboard Child Profile</text>

    <ellipse cx="440" cy="400" rx="105" ry="33" fill="#F3E5F5" stroke="#B57EDC" stroke-width="1.8"/>
    <text x="440" y="404" text-anchor="middle" font-size="13.5" fill="#4A3B52">View Real-Time Location</text>

    <ellipse cx="440" cy="510" rx="105" ry="33" fill="#F3E5F5" stroke="#B57EDC" stroke-width="1.8"/>
    <text x="440" y="514" text-anchor="middle" font-size="13.5" fill="#4A3B52">Define / Edit Safe Zones</text>

    <ellipse cx="440" cy="620" rx="105" ry="33" fill="#F3E5F5" stroke="#B57EDC" stroke-width="1.8"/>
    <text x="440" y="612" text-anchor="middle" font-size="13" fill="#4A3B52">View Vitals Analytics</text>
    <text x="440" y="628" text-anchor="middle" font-size="13" fill="#4A3B52">&amp; History</text>

    <ellipse cx="440" cy="730" rx="105" ry="33" fill="#F3E5F5" stroke="#B57EDC" stroke-width="1.8"/>
    <text x="440" y="734" text-anchor="middle" font-size="13" fill="#4A3B52">Configure Alert Thresholds</text>

    <ellipse cx="440" cy="840" rx="105" ry="33" fill="#F3E5F5" stroke="#B57EDC" stroke-width="1.8"/>
    <text x="440" y="844" text-anchor="middle" font-size="13.5" fill="#4A3B52">View Calibration Status</text>

    <ellipse cx="440" cy="950" rx="105" ry="33" fill="#F3E5F5" stroke="#B57EDC" stroke-width="1.8"/>
    <text x="440" y="954" text-anchor="middle" font-size="13.5" fill="#4A3B52">Manage App Settings</text>

    <ellipse cx="440" cy="1060" rx="105" ry="33" fill="#F3E5F5" stroke="#B57EDC" stroke-width="1.8"/>
    <text x="440" y="1052" text-anchor="middle" font-size="13" fill="#4A3B52">View Privacy /</text>
    <text x="440" y="1068" text-anchor="middle" font-size="13" fill="#4A3B52">Data Policy</text>

    <ellipse cx="440" cy="1190" rx="105" ry="33" fill="#F3E5F5" stroke="#B57EDC" stroke-width="1.8"/>
    <text x="440" y="1194" text-anchor="middle" font-size="13.5" fill="#4A3B52">View Alerts in App</text>
  </g>

  <!-- ===================== RIGHT COLUMN USE CASES (ESP32) ===================== -->
  <g>
    <ellipse cx="800" cy="180" rx="105" ry="33" fill="#FCE4F0" stroke="#D89FCB" stroke-width="1.8"/>
    <text x="800" y="172" text-anchor="middle" font-size="13" fill="#4A3B52">Perform Baseline</text>
    <text x="800" y="188" text-anchor="middle" font-size="13" fill="#4A3B52">Calibration</text>

    <ellipse cx="800" cy="290" rx="105" ry="33" fill="#FCE4F0" stroke="#D89FCB" stroke-width="1.8"/>
    <text x="800" y="294" text-anchor="middle" font-size="13.5" fill="#4A3B52">Collect Sensor Readings</text>

    <ellipse cx="800" cy="400" rx="105" ry="33" fill="#FCE4F0" stroke="#D89FCB" stroke-width="1.8"/>
    <text x="800" y="392" text-anchor="middle" font-size="13" fill="#4A3B52">Apply Z-Score</text>
    <text x="800" y="408" text-anchor="middle" font-size="13" fill="#4A3B52">Normalization</text>

    <ellipse cx="800" cy="510" rx="105" ry="33" fill="#FCE4F0" stroke="#D89FCB" stroke-width="1.8"/>
    <text x="800" y="514" text-anchor="middle" font-size="13" fill="#4A3B52">Sliding Window Filtering</text>

    <ellipse cx="800" cy="620" rx="105" ry="33" fill="#FCE4F0" stroke="#D89FCB" stroke-width="1.8"/>
    <text x="800" y="612" text-anchor="middle" font-size="13" fill="#4A3B52">Classify Stress</text>
    <text x="800" y="628" text-anchor="middle" font-size="13" fill="#4A3B52">(Random Forest)</text>

    <ellipse cx="800" cy="730" rx="105" ry="33" fill="#FCE4F0" stroke="#D89FCB" stroke-width="1.8"/>
    <text x="800" y="734" text-anchor="middle" font-size="13.5" fill="#4A3B52">Detect Geofence Breach</text>

    <ellipse cx="800" cy="840" rx="105" ry="33" fill="#FCE4F0" stroke="#D89FCB" stroke-width="1.8"/>
    <text x="800" y="844" text-anchor="middle" font-size="13.5" fill="#4A3B52">Sync Data to Firebase</text>
  </g>

  <!-- ===================== ALERT DISPATCH LAYER ===================== -->
  <g>
    <ellipse cx="620" cy="1380" rx="105" ry="33" fill="#EFE3FB" stroke="#B98CCE" stroke-width="1.8"/>
    <text x="620" y="1384" text-anchor="middle" font-size="13.5" fill="#4A3B52">Push FCM Notification</text>

    <ellipse cx="880" cy="1380" rx="105" ry="33" fill="#FCE4F0" stroke="#D89FCB" stroke-width="1.8"/>
    <text x="880" y="1384" text-anchor="middle" font-size="13.5" fill="#4A3B52">Send SMS Alert</text>
  </g>

  <!-- ===================== INCLUDE RELATIONSHIPS (rose dashed, orthogonal, open arrowhead) ===================== -->
  <g stroke="#C2569B" stroke-width="1.3" fill="none" stroke-dasharray="6,4" stroke-linecap="square">
    <!-- Classify Stress includes Apply Z-Score Normalization (routed through the column gap, clear of Sliding Window Filtering) -->
    <path d="M695,633 L665,633 L665,400 L695,400" marker-end="url(#arrowInclude)"/>
    <!-- Classify Stress includes Sliding Window Filtering (direct, same column) -->
    <path d="M800,587 L800,543" marker-end="url(#arrowInclude)"/>
    <!-- Onboard Child Profile includes Perform Baseline Calibration -->
    <path d="M545,290 L620,290 L620,180 L695,180" marker-end="url(#arrowInclude)"/>
  </g>
  <rect x="638" y="500" width="60" height="15" fill="#FBF6FC"/>
  <text x="668" y="511" text-anchor="middle" font-size="10.5" font-style="italic" fill="#C2569B">«include»</text>
  <rect x="770" y="557" width="60" height="15" fill="#FBF6FC"/>
  <text x="800" y="568" text-anchor="middle" font-size="10.5" font-style="italic" fill="#C2569B">«include»</text>
  <rect x="590" y="227" width="60" height="15" fill="#FBF6FC"/>
  <text x="620" y="238" text-anchor="middle" font-size="10.5" font-style="italic" fill="#C2569B">«include»</text>

  <!-- ===================== EXTEND RELATIONSHIPS (purple dashed, orthogonal, open arrowhead) ===================== -->
  <g stroke="#7D5BA6" stroke-width="1.3" fill="none" stroke-dasharray="6,4" stroke-linecap="square">
    <!-- Send SMS Alert extends Classify Stress (Random Forest) — enters right edge, own lane -->
    <path d="M985,1362 L1010,1362 L1010,610 L905,610" marker-end="url(#arrowExtend)"/>
    <!-- Send SMS Alert extends Detect Geofence Breach — enters right edge, own lane -->
    <path d="M985,1380 L1025,1380 L1025,720 L905,720" marker-end="url(#arrowExtend)"/>
    <!-- Push FCM Notification extends Classify Stress (Random Forest) — enters left edge, shared trunk with the line below -->
    <path d="M620,1347 L620,610 L695,610" marker-end="url(#arrowExtend)"/>
    <!-- Push FCM Notification extends Detect Geofence Breach — enters left edge, shared trunk -->
    <path d="M620,1347 L620,720 L695,720" marker-end="url(#arrowExtend)"/>
    <!-- View Alerts in App extends Push FCM Notification -->
    <path d="M545,1190 L580,1190 L580,1320 L590,1320 L590,1347" marker-end="url(#arrowExtend)"/>
  </g>
  <rect x="925" y="602" width="60" height="15" fill="#FBF6FC"/>
  <text x="955" y="613" text-anchor="middle" font-size="10.5" font-style="italic" fill="#7D5BA6">«extend»</text>
  <rect x="935" y="712" width="60" height="15" fill="#FBF6FC"/>
  <text x="965" y="723" text-anchor="middle" font-size="10.5" font-style="italic" fill="#7D5BA6">«extend»</text>
  <rect x="625" y="602" width="60" height="15" fill="#FBF6FC"/>
  <text x="655" y="613" text-anchor="middle" font-size="10.5" font-style="italic" fill="#7D5BA6">«extend»</text>
  <rect x="625" y="712" width="60" height="15" fill="#FBF6FC"/>
  <text x="655" y="723" text-anchor="middle" font-size="10.5" font-style="italic" fill="#7D5BA6">«extend»</text>
  <rect x="550" y="1248" width="60" height="15" fill="#FBF6FC"/>
  <text x="580" y="1259" text-anchor="middle" font-size="10.5" font-style="italic" fill="#7D5BA6">«extend»</text>

  <!-- ===================== LEGEND ===================== -->
  <g>
    <rect x="1030" y="1180" width="240" height="190" rx="10" fill="#FFFFFF" stroke="#C9A6DE" stroke-width="1.5"/>
    <text x="1050" y="1206" font-size="13" font-weight="700" fill="#6A3D8C">Legend</text>

    <line x1="1045" y1="1228" x2="1080" y2="1228" stroke="#A88FC2" stroke-width="1.5"/>
    <text x="1090" y="1232" font-size="11.5" fill="#4A3B52">Association</text>

    <line x1="1045" y1="1252" x2="1080" y2="1252" stroke="#C2569B" stroke-width="1.3" stroke-dasharray="6,4" marker-end="url(#arrowInclude)"/>
    <text x="1090" y="1256" font-size="11.5" fill="#4A3B52">«include»</text>

    <line x1="1045" y1="1276" x2="1080" y2="1276" stroke="#7D5BA6" stroke-width="1.3" stroke-dasharray="6,4" marker-end="url(#arrowExtend)"/>
    <text x="1090" y="1280" font-size="11.5" fill="#4A3B52">«extend»</text>

    <circle cx="1052" cy="1300" r="8" fill="#FBE3F1" stroke="#6A3D8C" stroke-width="1.5"/>
    <text x="1090" y="1304" font-size="11.5" fill="#4A3B52">Human Actor</text>

    <rect x="1042" y="1316" width="20" height="14" fill="#FBE3F1" stroke="#D98CC4" stroke-width="1.5"/>
    <text x="1090" y="1328" font-size="11.5" fill="#4A3B52">System Actor</text>

    <ellipse cx="1052" cy="1350" rx="14" ry="9" fill="#F3E5F5" stroke="#B57EDC" stroke-width="1.5"/>
    <text x="1090" y="1354" font-size="11.5" fill="#4A3B52">Use Case</text>
  </g>

</svg>
